name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests glue_jobs
      - run: pytest --cov=stockstream --cov-report=term-missing

  glue-runtime:
    # The Glue jobs run on Python shell 3.9; test them on exactly that runtime and the pinned libraries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pandas==2.2.3 pyarrow==17.0.0 numpy==1.26.4 pyyaml==6.0.2 jsonschema==4.23.0 boto3 "moto[s3,kinesis]" pytest requests websockets vermin
      - run: vermin --no-tips --violations -t=3.9- --eval-annotations glue_jobs src/stockstream/aggregations src/stockstream/common src/stockstream/dq
      # producer (02, 04b, 17) and SQL (18) tests do not run in Glue, so they are skipped here
      - run: pytest tests/unit/test_stats.py tests/chaos -k "not test_02 and not test_04b and not test_17 and not test_18"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false
      - run: mkdir -p build && touch build/stream_processor.zip build/stockstream-0.1.0-py3-none-any.whl
      - run: terraform -chdir=infra validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
