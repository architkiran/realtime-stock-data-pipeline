[project]
name = "stockstream"
version = "0.1.0"
description = "Real-time stock and crypto trade pipeline on AWS (Kinesis, Lambda, S3, Glue, Athena)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "jsonschema>=4.21",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[kinesis,s3,sqs]>=5", "ruff>=0.5", "duckdb>=1.0", "vermin>=1.6"]
dashboard = ["streamlit>=1.35", "pyathena>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockstream = ["contracts/*.json", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["chaos: adversarial tests from the break-it phase"]

[tool.ruff]
line-length = 120
target-version = "py39"  # Glue Python shell is 3.9: stop ruff "upgrading" to 3.11-only APIs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
